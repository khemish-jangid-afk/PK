<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Activity Monitor</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #160711;
            --panel: rgba(40, 13, 28, .88);
            --panel-border: rgba(251, 113, 133, .28);
            --text: #fff1f2;
            --muted: #fda4af;
            --pink: #fb7185;
            --gold: #fbbf24;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 18px;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top left, #881337 0, transparent 42%),
                linear-gradient(135deg, var(--bg), #020617 90%);
        }

        .shell {
            width: min(1050px, 100%);
            margin: 0 auto;
        }

        .eyebrow {
            color: var(--muted);
            font-size: .75rem;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 8px 0 5px;
            font-size: clamp(1.7rem, 4vw, 2.5rem);
        }

        .subtitle {
            margin: 0 0 24px;
            color: #fecdd3;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin: -10px 0 16px;
        }

        .clear-button {
            border: 1px solid rgba(248, 113, 113, .55);
            border-radius: 10px;
            padding: 9px 14px;
            color: #fecaca;
            background: rgba(127, 29, 29, .42);
            cursor: pointer;
            font-weight: 700;
        }

        .clear-button:hover {
            background: rgba(185, 28, 28, .65);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .card {
            padding: 22px;
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            background: var(--panel);
            box-shadow: 0 18px 50px rgba(0, 0, 0, .24);
            backdrop-filter: blur(14px);
        }

        .status-card {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .pulse {
            width: 13px;
            height: 13px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 0 0 rgba(74, 222, 128, .75);
            animation: pulse 1.8s infinite;
        }

        .status-label {
            color: var(--muted);
            font-size: .8rem;
        }

        .status-value {
            margin-top: 5px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .session-id {
            margin-top: 9px;
            color: #fda4af;
            font: .72rem ui-monospace, monospace;
            overflow-wrap: anywhere;
        }

        .decision {
            margin: 16px 0;
            border-color: rgba(251, 191, 36, .7);
            background: linear-gradient(120deg, rgba(146, 64, 14, .65), rgba(40, 13, 28, .92));
        }

        .decision.blocked {
            border-color: rgba(248, 113, 113, .7);
            background: linear-gradient(120deg, rgba(127, 29, 29, .7), rgba(40, 13, 28, .92));
        }

        .decision h2 {
            margin: 0 0 7px;
            font-size: 1rem;
        }

        .decision p {
            margin: 0;
            line-height: 1.55;
        }

        .timeline-card {
            margin-top: 16px;
        }

        .timeline-card h2 {
            margin: 0 0 14px;
            font-size: 1.15rem;
        }

        .timeline {
            display: grid;
            gap: 10px;
            max-height: 52vh;
            overflow: auto;
            padding-right: 4px;
        }

        .event {
            display: grid;
            grid-template-columns: 90px 1fr;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(251, 113, 133, .13);
        }

        .event:last-child {
            border-bottom: 0;
        }

        .event-time {
            color: var(--muted);
            font-size: .8rem;
            white-space: nowrap;
        }

        .event-message {
            line-height: 1.45;
        }

        .event-type {
            display: block;
            margin-top: 4px;
            color: #fda4af;
            font-size: .72rem;
        }

        .empty {
            color: #fda4af;
            font-size: .9rem;
        }

        .error {
            color: #fecaca;
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 9px rgba(74, 222, 128, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0);
            }
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .event {
                grid-template-columns: 78px 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <main id="dashboard" class="shell" hidden>
        <div class="eyebrow">Private activity monitor</div>
        <h1>Her Journey, Live</h1>
        <p class="subtitle">Realtime chapter activity from the story experience.</p>
        <div class="toolbar">
            <button id="clear-data-button" class="clear-button" type="button">Clear Activity Data</button>
        </div>

        <section class="grid">
            <article class="card status-card">
                <span class="pulse" aria-label="Live"></span>
                <div>
                    <div class="status-label">CURRENT STATUS</div>
                    <div id="current-status" class="status-value">Waiting for activity...</div>
                    <div id="session-id" class="session-id"></div>
                </div>
            </article>
            <article id="decision-card" class="card decision" hidden>
                <h2 id="decision-title">Final decision</h2>
                <p id="decision-message"></p>
            </article>
        </section>

        <section class="card timeline-card">
            <h2>Action History</h2>
            <div id="timeline" class="timeline">
                <p class="empty">Waiting for the first chapter event...</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { onValue, ref, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { database, initializationError } from "./firebase-config.js";

        const ADMIN_PASSWORD = "1234";
        const dashboard = document.getElementById("dashboard");
        const clearDataButton = document.getElementById("clear-data-button");

        async function clearActivityData() {
            const confirmed = window.confirm("Clear all activity data and unlock the journey for a new visit?");
            if (!confirmed) return;

            clearDataButton.disabled = true;
            clearDataButton.textContent = "Clearing...";
            // Reset the index.html lock immediately, even if Firebase is offline.
            localStorage.removeItem("isBlocked");

            if (!database) {
                clearDataButton.textContent = "Site Unlocked";
                return;
            }

            try {
                await remove(ref(database, "sessions"));
                clearDataButton.textContent = "Data Cleared";
            } catch (error) {
                console.error("Unable to clear activity data:", error);
                clearDataButton.disabled = false;
                clearDataButton.textContent = "Clear Activity Data";
                window.alert(`Could not clear data: ${error.message}`);
            }
        }

        function showMessage(message, className = "empty") {
            dashboard.hidden = false;
            dashboard.innerHTML = `<section class="card"><p class="${className}">${escapeHtml(message)}</p></section>`;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function eventTime(event) {
            if (typeof event?.serverTimestamp === "number") return event.serverTimestamp;
            const parsed = Date.parse(event?.clientTimestamp || "");
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function formatTime(timestamp) {
            if (!timestamp) return "--:--";
            return new Date(timestamp).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }

        function latestSession(sessions) {
            return Object.entries(sessions || {}).sort(([, a], [, b]) => {
                const aTime = eventTime(a?.activeStatus) || Math.max(...Object.values(a?.logs || {}).map(eventTime), 0);
                const bTime = eventTime(b?.activeStatus) || Math.max(...Object.values(b?.logs || {}).map(eventTime), 0);
                return bTime - aTime;
            })[0];
        }

        function render(sessions) {
            const latest = latestSession(sessions);
            if (!latest) return;

            const [sessionId, session] = latest;
            const active = session.activeStatus || {};
            document.getElementById("current-status").textContent = active.chapterNumber
                ? `Currently Reading: Chapter ${active.chapterNumber} — ${active.chapterTitle || ""}`
                : "Waiting for chapter activity...";
            document.getElementById("session-id").textContent = `Session: ${sessionId}`;

            const events = Object.values(session.logs || {}).sort((a, b) => eventTime(b) - eventTime(a));
            document.getElementById("timeline").innerHTML = events.length
                ? events.map((event) => {
                    const isDecision = event.eventType === "user_decision";
                    const message = isDecision
                        ? `${event.decisionType}: ${event.message}`
                        : `Opened Chapter ${event.chapterNumber}: ${event.chapterTitle}`;
                    return `<article class="event">
                        <time class="event-time">${escapeHtml(formatTime(eventTime(event)))}</time>
                        <div class="event-message">${escapeHtml(message)}<span class="event-type">${escapeHtml(event.eventType)}</span></div>
                    </article>`;
                }).join("")
                : '<p class="empty">Waiting for the first chapter event...</p>';

            const decision = events.find((event) => event.eventType === "user_decision");
            const decisionCard = document.getElementById("decision-card");
            if (decision) {
                decisionCard.hidden = false;
                decisionCard.classList.toggle("blocked", decision.decisionType === "BLOCKED");
                document.getElementById("decision-title").textContent = `Decision: ${decision.decisionType}`;
                document.getElementById("decision-message").textContent = `${decision.message} — ${formatTime(eventTime(decision))}`;
            }
        }

        const password = window.prompt("Admin password:");
        if (password !== ADMIN_PASSWORD) {
            showMessage("Access denied.", "error");
        } else {
            dashboard.hidden = false;
            clearDataButton.addEventListener("click", clearActivityData);
            if (!database) {
                const reason = initializationError?.message || "Firebase database is not initialized.";
                document.getElementById("timeline").innerHTML = `<p class="error">Firebase is unavailable: ${escapeHtml(reason)}. The button can still unlock this browser.</p>`;
            } else {
                onValue(
                    ref(database, "sessions"),
                    (snapshot) => render(snapshot.val()),
                    (error) => showMessage(`Realtime Database error: ${error.message}`, "error")
                );
            }
        }
    </script>
</body>

</html>
